# Gazebo Manipulator Settings
# This file contains settings for the manipulator (3-axis ring) visual elements

[manipulator]
# Scale factor for the manipulator axes
scale = 1.5

# Width of the axis lines
line_width = 3.0

# Size of the axis arrows
arrow_size = 0.3

# Size of the rotation rings
ring_size = 0.5

# Colors for the axes (RGB values)
axis_x_color = 1.0 0.0 0.0
axis_y_color = 0.0 1.0 0.0
axis_z_color = 0.0 0.0 1.0

# Transparency of the manipulator
transparency = 0.3